[package]
name = "pwm"
version = "0.6.7"
description = "Pipa Window Manager, a light Penrose Libraries WM."
authors = ["Daniel Azevedo", "dani-77 <daniazevedo77@posteo.net>"]
license = "MIT"
edition = "2024"

[dependencies]
# Already pulled in transitively by penrose (which uses it to set SIGCHLD to
# SigIgn in WindowManager::run) - declared directly too so main.rs can reset
# that disposition before restart() re-execs the binary. Pinned to the same
# major.minor penrose itself resolves to, to avoid a second copy.
nix = { version = "0.30", default-features = false, features = ["signal"] }
penrose = "0.4.0"
penrose_ui = "0.4.0"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.4"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
# Already pulled in by penrose; used directly by xwatch.rs.
x11rb = "0.13"

# Local copy of penrose_ui 0.4.0 with a fix for a startup race that killed pwm;
# see vendor/penrose_ui/PWM_CHANGES.md. Drop it once upstream has the fix.
[patch.crates-io]
penrose_ui = { path = "vendor/penrose_ui" }
